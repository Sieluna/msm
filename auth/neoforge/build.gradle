plugins { id 'net.neoforged.moddev' version '2.0.148' }
base.archivesName = 'auth-neoforge'
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
dependencies {
    implementation project(':core')
}
neoForge {
    version = '26.3.0.98'
    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run')
        }
    }
    mods {
        auth { sourceSet sourceSets.main }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar {
    dependsOn ':core:classes'
    from project(':core').sourceSets.main.output
}
